name: CI

# De kwaliteitspoort. Alles wat een agent produceert moet hier doorheen,
# precies zoals werk van een mens. Zonder deze poort is elke agent-PR een gok
# die een mens volledig handmatig moet narekenen.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Eén run per branch: een nieuwe push maakt de vorige run overbodig.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, unit, integratie)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven-commando bepalen
        id: mvn
        run: |
          # De wrapper is de norm (reproduceerbare build). Zolang die nog niet
          # op main staat, valt CI terug op de Maven van de runner in plaats van
          # rood te worden op iets dat niets met de wijziging te maken heeft.
          if [ -x ./mvnw ]; then
            echo "cmd=./mvnw" >> "$GITHUB_OUTPUT"
          elif [ -f ./mvnw ]; then
            chmod +x ./mvnw
            echo "cmd=./mvnw" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Geen Maven wrapper::backend/mvnw ontbreekt; CI gebruikt de Maven van de runner. Builds zijn dan niet reproduceerbaar."
            echo "cmd=mvn" >> "$GITHUB_OUTPUT"
          fi

      - name: Formattering (spotless)
        run: |
          if grep -q "spotless-maven-plugin" pom.xml; then
            ${{ steps.mvn.outputs.cmd }} -B spotless:check
          else
            echo "::notice title=spotless nog niet geconfigureerd::Stap overgeslagen (fase 0, Persoon A)."
          fi

      - name: Statische analyse (checkstyle)
        run: |
          if grep -q "maven-checkstyle-plugin" pom.xml; then
            ${{ steps.mvn.outputs.cmd }} -B checkstyle:check
          else
            echo "::notice title=checkstyle nog niet geconfigureerd::Stap overgeslagen (fase 0, Persoon A)."
          fi

      - name: Build, unit- en integratietests
        # `verify` draait surefire (*Test) én failsafe (*IT). Testcontainers
        # gebruikt de Docker-daemon die op de runner al draait.
        run: ${{ steps.mvn.outputs.cmd }} -B verify

      - name: Coverage-drempel (jacoco)
        run: |
          if grep -q "jacoco-maven-plugin" pom.xml; then
            ${{ steps.mvn.outputs.cmd }} -B jacoco:check
          else
            echo "::notice title=jacoco nog niet geconfigureerd::Stap overgeslagen (fase 0, Persoon A)."
          fi

      - name: Testrapporten bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-testrapporten
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencies (exact volgens lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  rules-drift:
    name: Business rules (drift-gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Drift-check
        # Regenereert docs/discovered-rules.md uit de domeincode en faalt als
        # het resultaat afwijkt van wat in de repo staat. Zo kan documentatie
        # niet meer stilletjes verouderen.
        env:
          # Repo-variable: zet op `true` zodra de rule-registry uit fase 1 er
          # staat. Tot die tijd waarschuwt de stap in plaats van te falen.
          RULES_DRIFT_REQUIRED: ${{ vars.RULES_DRIFT_REQUIRED || 'false' }}
        run: bash scripts/rules-drift.sh

  gate:
    # Eén check om verplicht te stellen in branch protection. Komt er later een
    # job bij, dan hoeft de instelling op GitHub niet mee te veranderen.
    name: Kwaliteitspoort
    runs-on: ubuntu-latest
    needs: [backend, frontend, rules-drift]
    if: always()
    steps:
      - name: Resultaat van alle jobs
        run: |
          echo "backend:     ${{ needs.backend.result }}"
          echo "frontend:    ${{ needs.frontend.result }}"
          echo "rules-drift: ${{ needs['rules-drift'].result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error title=Poort dicht::Minstens één job is rood."
            exit 1
          fi
